name: Build and Release VSIX

on:
  push:
    tags:
      - 'v*' # v1.0.0 などのタグがプッシュされた時に起動

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run compile

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          # タグ名 (例: v1.0.0) から 'v' を除いたバージョン番号を取得
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Package VSIX
        run: |
          # package.json のバージョンをタグのバージョンに書き換え
          npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version
          npx vsce package

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fujitsu-gap-extension
          path: "*.vsix"

      # ZIP 作成（タグ名を使用）          
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path *.vsix `
            -DestinationPath fujitsu-gap-copilot-${{ github.ref_name }}.zip

      # Release を作成または更新し、ZIP を添付
      - name: Create or Update Release and Upload ZIP
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: fujitsu-gap-copilot-${{ github.ref_name }}.zip
