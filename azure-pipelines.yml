trigger:
- main
- master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
- task: UseNode@1
  inputs:
    version: '26.x'
  displayName: 'Install Node.js'

- powershell: |
    npm install
    npm run compile
    npx vsce package
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    $package = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
    $vsixName = "$($package.name)-$($package.version).vsix"
    if (-not (Test-Path -LiteralPath $vsixName -PathType Leaf)) {
      throw "Expected VSIX package not found: $vsixName"
    }
    Write-Host "##vso[task.setvariable variable=vsixName]$vsixName"
  displayName: 'Build VSIX Package'

- task: PublishBuildArtifacts@1
  condition: succeeded()
  inputs:
    PathtoPublish: '$(vsixName)'
    ArtifactName: 'fujitsu-gap-extension'
    publishLocation: 'Container'
  displayName: 'Publish VSIX Artifact'
